services:
  - type: web
    name: tetra-studio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: DATA_FILE
        value: /tmp/data.json
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_TO
        value: tetra.studio26@gmail.com
      - key: CONTACT_FROM
        sync: false
